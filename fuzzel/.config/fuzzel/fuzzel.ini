# fuzzel/.config/fuzzel/fuzzel.ini
# Stopgap styling for the network picker (BUILD_SPEC.md §3, "Locked network
# picker"): locked tokens only, until Phase 3 styles the launcher. Colors
# are RRGGBBAA; each one names the style.css token it mirrors. fuzzel has
# no text-shadow, so no double-strike weight here.

font=DepartureMono Nerd Font:pixelsize=11

[colors]
# --bg
background=15140fff
# --text
text=d6d0bdff
input=d6d0bdff
message=d6d0bdff
prompt=d6d0bdff
# --text-dim
placeholder=8f8a76ff
counter=8f8a76ff
# --accent
match=5fae5aff
selection-match=5fae5aff
# --border, with --text on it
selection=3a3626ff
selection-text=d6d0bdff
# --border
border=3a3626ff

[border]
width=1
radius=0
selection-radius=0
