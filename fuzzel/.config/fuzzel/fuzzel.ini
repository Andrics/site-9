# fuzzel/.config/fuzzel/fuzzel.ini
# Network picker styling (BUILD_SPEC.md §3, "Locked network picker"): the
# VOX drop-down list look, until Phase 3 styles the launcher. Colors are
# RRGGBBAA; each one names the style.css token it mirrors. fuzzel takes
# one border color, so the edge is a flat --bevel-dark (no bevel).

font=DepartureMono Nerd Font:pixelsize=11

[colors]
# --field
background=303f25ff
# --text
text=cbcfc8ff
input=cbcfc8ff
prompt=cbcfc8ff
message=cbcfc8ff
# --panel (selected row)
selection=445435ff
# --text-bright
selection-text=ffffffff
match=ffffffff
selection-match=ffffffff
# --text-dim
placeholder=8f9a85ff
counter=8f9a85ff
# --bevel-dark
border=1f2719ff

[border]
width=1
radius=0
selection-radius=0

[key-bindings]
# F5 = refresh in waybar's network picker: fuzzel exits with code 10,
# net-menu rescans and reopens. (Replaces custom-1's default, Mod1+1.)
custom-1=F5
