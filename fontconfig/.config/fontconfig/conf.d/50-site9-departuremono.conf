<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig/.config/fontconfig/conf.d/50-site9-departuremono.conf

     SITE-9: draw DepartureMono without antialiasing, in every app
     (user, 2026-10-18). It's a pixel font on an 11px grid; Qt apps
     (Dolphin) place its glyphs half a pixel off, so with antialiasing
     every stroke smears over two columns. Monochrome rendering snaps
     the glyphs to whole pixels. GTK, kitty and waybar text was already
     crisp; the Nerd icons in the same font (e.g. the bar's ◄ ⏻ ▂▄▆) lose
     their soft edges — accepted with the pick. -->
<fontconfig>
  <match target="font">
    <test name="family"><string>DepartureMono Nerd Font</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
