# networkmanager-dmenu/.config/networkmanager-dmenu/config.ini
# Network picker behind NET (BUILD_SPEC.md §3, "Locked network picker").
# Styling comes from fuzzel.ini.

[dmenu]
# Top-right, 8px from the screen edge and 8px under the bar: fuzzel's
# y-margin counts from below the bar's exclusive zone. No --dmenu here;
# networkmanager_dmenu adds it (plus --placeholder) for fuzzel itself.
dmenu_command = fuzzel --anchor top-right --x-margin 8 --y-margin 8
# Signal steps, the same ▂▄▆█ as NET on the bar.
wifi_chars = ▂▄▆█
format = {name}  {sec}  {bars}

[dmenu_passphrase]
# Adds fuzzel's --password: the passphrase is masked.
obscure = True
