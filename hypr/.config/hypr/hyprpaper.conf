# hyprpaper 0.8.4 (hyprlang, keys checked in its v0.8.4 source).
# SITE-9 "facility wall" (BUILD_SPEC.md §3 "Wallpaper"). The PNG is made
# by wallpaper/tools/make-wallpaper.py and lives outside the repo (it
# holds the user's logo). Static image: no CPU while idle.

splash = false
ipc = true

wallpaper {
    monitor = eDP-1
    path = ~/.local/share/site-9/wallpaper.png
    fit_mode = cover
}
