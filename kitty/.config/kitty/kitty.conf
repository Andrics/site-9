# kitty/.config/kitty/kitty.conf
# SITE-9 terminal (BUILD_SPEC.md §3 "Locked terminal: kitty").
# Colors are §3 tokens or the P2 DOS/VGA palette, named in each comment.

# --- Font: DepartureMono sits on an 11px grid; 8.25pt = 11px at
# kitty's 96 DPI, scale 1.
font_family DepartureMono Nerd Font
font_size 8.25
# Puts the underline on the cell's bottom pixel row, so the tab bar can
# use it as the buttons' bottom edge (tab_bar.py). Terminal underlines
# move down with it.
modify_font underline_position 2px

window_padding_width 4
shell_integration no-cursor
confirm_os_window_close 0

# --- Colors
# --field
background #303f25
# --text
foreground #cbcfc8
# --text, solid block (no blink)
cursor #cbcfc8
cursor_text_color background
cursor_blink_interval 0
# S1: --panel + --text-bright, same as the menus
selection_background #445435
selection_foreground #ffffff
# P2 bright blue
url_color #9b9bff
url_style straight

# --- Window frame (F3) and split borders: bevel.py turns each pane's
# 1px border into a recessed bevel — top/left inactive_border_color,
# bottom/right active_border_color — and paints the margin --panel.
watcher bevel.py
# 6pt = 8px of --panel around each pane
window_margin_width 6
window_border_width 1px
# Full borders on a single window too (margins already force full
# borders when there are splits, overriding draw_minimal_borders).
draw_window_borders_for_single_window yes
draw_minimal_borders yes
# --bevel-light (bevel bottom/right)
active_border_color #667359
# --bevel-dark (bevel top/left)
inactive_border_color #1f2719
# --warning
bell_border_color #e6a84f

# --- Tab bar: a --panel strip with tabs drawn as VOX buttons by
# tab_bar.py (inactive raised, active pressed in).
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style custom
tab_title_template "{index}:{title.upper()}"
active_tab_font_style normal
inactive_tab_font_style normal
# 3pt = 4px of strip around the tabs
tab_bar_margin_width 3
tab_bar_margin_height 3 3
# --panel
tab_bar_background #445435
# --panel
tab_bar_margin_color #445435

# --- ANSI palette P2: classic DOS/VGA, lightened only as far as needed
# to read on --field.
# P2 black
color0 #000000
# P2 red
color1 #da9191
# P2 green
color2 #36bc36
# P2 yellow (brown)
color3 #cd9b69
# P2 blue
color4 #9e9edf
# P2 magenta
color5 #d88ad8
# P2 cyan
color6 #24b6b6
# P2 white (light grey)
color7 #aaaaaa
# P2 bright black (dark grey, ~3:1)
color8 #8a8a8a
# P2 bright red
color9 #ff7c7c
# P2 bright green (true DOS)
color10 #55ff55
# P2 bright yellow (true DOS)
color11 #ffff55
# P2 bright blue
color12 #9b9bff
# P2 bright magenta
color13 #ff61ff
# P2 bright cyan (true DOS)
color14 #55ffff
# P2 bright white
color15 #ffffff
