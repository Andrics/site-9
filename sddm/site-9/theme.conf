[General]
# P1 = "access terminal" (one VOX panel on the facility wall),
# P2 = DOS-style full-screen prompt on --field.
variant=P1
# Made by wallpaper/tools/make-wallpaper.py --no-placard, copied in at
# install time (not in the repo). Missing file = plain --field.
background=background.png
# Password mask character: * or • or █ (all in DepartureMono)
maskChar=*
# Show the session row (Hyprland / Hyprland (uwsm-managed))
showSession=false
# Preview only (sddm-greeter-qt6 --test-mode can't log in): normal,
# denied or caps. Leave empty in the installed theme.
previewState=
