# gtk/.config/gtk-3.0/settings.ini — SITE-9 GTK3 settings
# (BUILD_SPEC.md §3 "Locked app theme: GTK3"). The same values are set
# in gsettings (org.gnome.desktop.interface), which GTK reads through
# the Settings portal; this file covers apps that read it directly.
[Settings]
gtk-theme-name=SITE-9
gtk-application-prefer-dark-theme=true
# 8.25pt = 11px at 96 DPI — DepartureMono's pixel grid
gtk-font-name=DepartureMono Nerd Font 8.25
# Text cursor doesn't blink (pick d, same as kitty)
gtk-cursor-blink=false
# No title-bar buttons (pick a): Hyprland closes windows by key
gtk-decoration-layout=:
# Always-visible 12px scrollbars, not thin overlay indicators
gtk-overlay-scrolling=false
# Icons: SITE-9 = Chicago95 remapped to the tokens (pick C2), built by
# icons/tools/make-icons.py into ~/.local/share/icons/SITE-9
gtk-icon-theme-name=SITE-9
# Cursor: Chicago95 white, 32px (its only size)
gtk-cursor-theme-name=Chicago95_Cursor_White
gtk-cursor-theme-size=32
